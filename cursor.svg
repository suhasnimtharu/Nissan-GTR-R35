<svg width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3a3a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEA00" />
      <stop offset="100%" stop-color="#FF9D00" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFB300" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Main Angular Chassis -->
    <polygon points="2,2 2,24 10,28 12,18 22,26 28,14" fill="url(#black)" stroke="#555" stroke-width="0.5"/>
    
    <!-- Topaz Inner Diamond (Left) -->
    <polygon points="4.5,8 4.5,16 8.5,18 8.5,10" fill="url(#gold)" />
    
    <!-- Topaz Wing (Right) -->
    <polygon points="12.5,19.5 19,23.5 23.5,16.5 17,12.5" fill="url(#gold)" />
  </g>
</svg>
